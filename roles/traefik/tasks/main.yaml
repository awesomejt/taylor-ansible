---
- name: Ensure role runs on Debian-family systems
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == "Debian"
    fail_msg: "traefik role currently supports Debian/Ubuntu only"

- name: Ensure Traefik project directory exists
  ansible.builtin.file:
    path: "{{ traefik_project_dir }}"
    state: directory
    owner: "{{ traefik_primary_user }}"
    group: "{{ traefik_primary_user }}"
    mode: "0755"

- name: Deploy Traefik Docker Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ traefik_compose_file }}"
    owner: "{{ traefik_primary_user }}"
    group: "{{ traefik_primary_user }}"
    mode: "0644"
  notify: Restart traefik service

- name: Deploy Traefik systemd unit
  ansible.builtin.template:
    src: traefik.service.j2
    dest: "{{ traefik_systemd_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik service

- name: Ensure Traefik TLS cert directory exists
  ansible.builtin.file:
    path: "{{ traefik_tls_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: traefik_tls_enabled | bool

- name: Ensure Traefik dynamic config directory exists
  ansible.builtin.file:
    path: "{{ traefik_tls_dynamic_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: traefik_tls_enabled | bool

- name: Check whether Traefik TLS certificate already exists
  ansible.builtin.stat:
    path: "{{ traefik_tls_cert_dir }}/{{ traefik_tls_cert_file }}"
  register: traefik_tls_cert_existing_path
  when: traefik_tls_enabled | bool

- name: Check whether Traefik TLS private key already exists
  ansible.builtin.stat:
    path: "{{ traefik_tls_cert_dir }}/{{ traefik_tls_key_file }}"
  register: traefik_tls_key_existing_path
  when: traefik_tls_enabled | bool

- name: Use existing Traefik TLS material when present
  ansible.builtin.include_tasks: tls-existing.yaml
  when:
    - traefik_tls_enabled | bool
    - traefik_tls_cert_existing_path.stat.exists | default(false)
    - traefik_tls_key_existing_path.stat.exists | default(false)

- name: Provision Traefik TLS material from Vault when missing
  ansible.builtin.include_tasks: tls-vault.yaml
  when:
    - traefik_tls_enabled | bool
    - not (traefik_tls_cert_existing_path.stat.exists | default(false) and traefik_tls_key_existing_path.stat.exists | default(false))

- name: Deploy Traefik dynamic TLS config
  ansible.builtin.template:
    src: tls.yaml.j2
    dest: "{{ traefik_tls_dynamic_dir }}/tls.yaml"
    owner: root
    group: root
    mode: '0644'
  when: traefik_tls_enabled | bool
  notify: Restart traefik service

- name: Ensure Traefik service is enabled and running
  ansible.builtin.systemd:
    name: "{{ traefik_systemd_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Traefik HTTP port to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ traefik_http_port }}"
    timeout: 60
