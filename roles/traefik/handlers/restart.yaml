- name: Stop traefik service cleanly
  ansible.builtin.systemd:
    name: "{{ traefik_systemd_unit }}"
    state: stopped

- name: Wait for Traefik dashboard port to be released
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ traefik_dashboard_port }}"
    state: stopped
    timeout: 60

- name: Start traefik service cleanly
  ansible.builtin.systemd:
    name: "{{ traefik_systemd_unit }}"
    enabled: true
    state: started
    daemon_reload: true