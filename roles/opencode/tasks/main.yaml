---
# ── User ──────────────────────────────────────────────────────────────────────

- name: Create opencode group
  become: true
  ansible.builtin.group:
    name: "{{ opencode_group }}"
    state: present

- name: Create opencode user
  become: true
  ansible.builtin.user:
    name: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    home: "{{ opencode_home_dir }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Grant opencode passwordless sudo
  become: true
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ opencode_user }}"
    content: "{{ opencode_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: opencode_sudo_nopasswd | bool

- name: Add opencode user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ opencode_user }}"
    groups: docker
    append: true
  when: opencode_docker_access | bool

# ── SSH key (GitHub access) ───────────────────────────────────────────────────

- name: Ensure .ssh directory exists
  become: true
  ansible.builtin.file:
    path: "{{ opencode_home_dir }}/.ssh"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0700"

- name: Deploy GitHub SSH private key
  become: true
  ansible.builtin.copy:
    dest: "{{ opencode_home_dir }}/.ssh/id_rsa"
    content: "{{ opencode_github_ssh_private_key }}"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0600"
  no_log: true
  when: opencode_github_ssh_private_key | length > 0

- name: Deploy GitHub SSH public key
  become: true
  ansible.builtin.copy:
    dest: "{{ opencode_home_dir }}/.ssh/id_rsa.pub"
    content: "{{ opencode_github_ssh_public_key }}"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0644"
  when: opencode_github_ssh_public_key | length > 0

- name: Add GitHub to known_hosts
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.known_hosts:
    name: "{{ opencode_github_known_host }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -H ' + opencode_github_known_host) }}"
    state: present
    path: "{{ opencode_home_dir }}/.ssh/known_hosts"

# ── Git ───────────────────────────────────────────────────────────────────────

- name: Configure git user name
  become: true
  become_user: "{{ opencode_user }}"
  community.general.git_config:
    name: user.name
    value: "{{ opencode_git_user_name }}"
    scope: global

- name: Configure git user email
  become: true
  become_user: "{{ opencode_user }}"
  community.general.git_config:
    name: user.email
    value: "{{ opencode_git_user_email }}"
    scope: global

- name: Configure git default branch
  become: true
  become_user: "{{ opencode_user }}"
  community.general.git_config:
    name: init.defaultBranch
    value: main
    scope: global

- name: Ensure OpenCode workspace directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ opencode_local_bin_dir }}", mode: "0755" }
    - { path: "{{ opencode_projects_dir }}", mode: "0775" }
    - { path: "{{ opencode_repos_dir }}", mode: "0775" }
    - { path: "{{ opencode_config_dir }}", mode: "0755" }

- name: Export OpenCode shell environment
  become: true
  ansible.builtin.blockinfile:
    path: "{{ opencode_home_dir }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: opencode environment"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0644"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
      export OPENCODE_CONFIG="$HOME/.config/opencode/opencode.workflows.json"
      export AGENTIC_WORKFLOWS_ROOT="$HOME/.config/opencode"
      export AWB_BIN="$HOME/.local/bin/awb"

- name: Write OpenCode global config
  become: true
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ opencode_global_config_path }}"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0644"

# ── System dev packages ───────────────────────────────────────────────────────

- name: Install system dev packages
  become: true
  ansible.builtin.apt:
    name: "{{ opencode_system_packages }}"
    state: present
    lock_timeout: 600

# ── Go ────────────────────────────────────────────────────────────────────────

- name: Add Go PPA
  become: true
  ansible.builtin.command: add-apt-repository -y "{{ opencode_go_ppa }}"
  args:
    creates: "/etc/apt/sources.list.d/longsleep-ubuntu-golang-backports-{{ ansible_distribution_release }}.sources"
  when: opencode_install_go | bool

- name: Update apt cache after adding Go PPA
  become: true
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 600
  when: opencode_install_go | bool

- name: Install Go (latest from PPA)
  become: true
  ansible.builtin.apt:
    name: "{{ opencode_go_package }}"
    state: latest
    lock_timeout: 600
  when: opencode_install_go | bool

# ── Python / uv ───────────────────────────────────────────────────────────────

- name: Check installed uv version
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.command: "{{ opencode_home_dir }}/.local/bin/uv --version"
  register: _uv_installed_version
  changed_when: false
  failed_when: false
  when: opencode_install_uv | bool

- name: Download uv installer
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ opencode_uv_version }}/uv-installer.sh"
    dest: /tmp/uv-installer.sh
    mode: "0755"
    force: true
  when:
    - opencode_install_uv | bool
    - _uv_installed_version.rc != 0 or opencode_uv_version not in _uv_installed_version.stdout

- name: Install uv for opencode user
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.command: bash /tmp/uv-installer.sh
  environment:
    HOME: "{{ opencode_home_dir }}"
    UV_INSTALL_DIR: "{{ opencode_home_dir }}/.local/bin"
  when:
    - opencode_install_uv | bool
    - _uv_installed_version.rc != 0 or opencode_uv_version not in _uv_installed_version.stdout

# ── Node.js / NVM ─────────────────────────────────────────────────────────────

- name: Check installed NVM version
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -c 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm --version'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  register: _nvm_installed_version
  changed_when: false
  failed_when: false
  when: opencode_install_nvm | bool

- name: Download NVM install script
  become: true
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/nvm-sh/nvm/v{{ opencode_nvm_version }}/install.sh"
    dest: /tmp/nvm-install.sh
    mode: "0755"
    force: true
  when:
    - opencode_install_nvm | bool
    - _nvm_installed_version.rc != 0 or opencode_nvm_version not in _nvm_installed_version.stdout

- name: Install NVM for opencode user
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.command: bash /tmp/nvm-install.sh
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  when:
    - opencode_install_nvm | bool
    - _nvm_installed_version.rc != 0 or opencode_nvm_version not in _nvm_installed_version.stdout

- name: Install Node.js versions via NVM
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm install {{ item }}'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  loop: "{{ opencode_node_versions }}"
  register: _nvm_install
  changed_when: "'is already installed' not in _nvm_install.stdout"
  when: opencode_install_nvm | bool

- name: Set default Node.js version
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm alias default {{ opencode_node_default }} && nvm use default'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  changed_when: false
  when: opencode_install_nvm | bool

- name: Update npm to latest
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm use default && npm install -g npm@latest'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  changed_when: false
  when: opencode_install_nvm | bool

# ── Java ecosystem / SDKMAN ───────────────────────────────────────────────────

- name: Download SDKMAN install script
  become: true
  ansible.builtin.get_url:
    url: "https://get.sdkman.io"
    dest: /tmp/sdkman-install.sh
    mode: "0755"
  when: opencode_install_sdkman | bool

- name: Install SDKMAN for opencode user
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.command: bash /tmp/sdkman-install.sh
  environment:
    HOME: "{{ opencode_home_dir }}"
    SDKMAN_DIR: "{{ opencode_home_dir }}/.sdkman"
  args:
    creates: "{{ opencode_home_dir }}/.sdkman/bin/sdkman-init.sh"
  when: opencode_install_sdkman | bool

- name: Install Java (Temurin LTS) via SDKMAN
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: >-
      bash -c 'source {{ opencode_home_dir }}/.sdkman/bin/sdkman-init.sh &&
      sdk install java {{ opencode_java_version }} < /dev/null'
  environment:
    HOME: "{{ opencode_home_dir }}"
    SDKMAN_DIR: "{{ opencode_home_dir }}/.sdkman"
  args:
    creates: "{{ opencode_home_dir }}/.sdkman/candidates/java/{{ opencode_java_version }}"
  when: opencode_install_sdkman | bool

- name: Install Groovy via SDKMAN
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: >-
      bash -c 'source {{ opencode_home_dir }}/.sdkman/bin/sdkman-init.sh &&
      sdk install groovy {{ opencode_groovy_version }} < /dev/null'
  environment:
    HOME: "{{ opencode_home_dir }}"
    SDKMAN_DIR: "{{ opencode_home_dir }}/.sdkman"
  args:
    creates: "{{ opencode_home_dir }}/.sdkman/candidates/groovy/{{ opencode_groovy_version }}"
  when: opencode_install_sdkman | bool

- name: Install Gradle via SDKMAN
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: >-
      bash -c 'source {{ opencode_home_dir }}/.sdkman/bin/sdkman-init.sh &&
      sdk install gradle {{ opencode_gradle_version }} < /dev/null'
  environment:
    HOME: "{{ opencode_home_dir }}"
    SDKMAN_DIR: "{{ opencode_home_dir }}/.sdkman"
  args:
    creates: "{{ opencode_home_dir }}/.sdkman/candidates/gradle/{{ opencode_gradle_version }}"
  when: opencode_install_sdkman | bool

- name: Install Maven via SDKMAN
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: >-
      bash -c 'source {{ opencode_home_dir }}/.sdkman/bin/sdkman-init.sh &&
      sdk install maven {{ opencode_maven_version }} < /dev/null'
  environment:
    HOME: "{{ opencode_home_dir }}"
    SDKMAN_DIR: "{{ opencode_home_dir }}/.sdkman"
  args:
    creates: "{{ opencode_home_dir }}/.sdkman/candidates/maven/{{ opencode_maven_version }}"
  when: opencode_install_sdkman | bool

# ── Global npm packages ───────────────────────────────────────────────────────

- name: Check installed global npm packages
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm use default && npm list -g --depth=0 --json'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  register: _npm_global_list
  changed_when: false
  failed_when: false
  when: opencode_install_nvm | bool

- name: Install global npm packages
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm use default && npm install -g {{ item }}'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  loop: "{{ opencode_npm_global_packages }}"
  when:
    - opencode_install_nvm | bool
    - item not in (_npm_global_list.stdout | default('{}'))

# ── OpenCode CLI ──────────────────────────────────────────────────────────────

- name: Check if OpenCode CLI is installed
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm use default >/dev/null && command -v {{ opencode_cli_command }}'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  register: _opencode_check
  changed_when: false
  failed_when: false
  when:
    - opencode_install_cli | bool
    - opencode_install_nvm | bool

- name: Install OpenCode CLI via npm
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm use default >/dev/null && npm install -g {{ opencode_cli_npm_package }}'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  when:
    - opencode_install_cli | bool
    - opencode_install_nvm | bool
    - _opencode_check.rc != 0

- name: Validate OpenCode CLI runtime
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: "bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh && nvm use default >/dev/null && {{ opencode_cli_command }} -v'"
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  register: _opencode_cli_health
  changed_when: false
  failed_when: false
  when:
    - opencode_install_cli | bool
    - opencode_install_nvm | bool

- name: Repair OpenCode CLI postinstall artifacts when required
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.shell:
    cmd: >-
      bash -lc 'source {{ opencode_home_dir }}/.nvm/nvm.sh &&
      nvm use default >/dev/null &&
      cd "$(npm root -g)/{{ opencode_cli_npm_package }}" &&
      node postinstall.mjs'
  environment:
    HOME: "{{ opencode_home_dir }}"
    NVM_DIR: "{{ opencode_home_dir }}/.nvm"
  when:
    - opencode_install_cli | bool
    - opencode_install_nvm | bool
    - _opencode_cli_health.rc != 0

# ── Workflow bundle / AWB / orchestrator deployment ──────────────────────────

- name: Validate controller-side workflow bundle path
  ansible.builtin.stat:
    path: "{{ opencode_controller_workflows_bundle_dir }}"
  delegate_to: localhost
  become: false
  register: _opencode_workflows_bundle_stat
  when: opencode_manage_workflows_bundle | bool

- name: Require workflow bundle source when bundle deployment is enabled
  ansible.builtin.assert:
    that:
      - opencode_controller_workflows_bundle_dir | length > 0
      - _opencode_workflows_bundle_stat.stat.exists
      - _opencode_workflows_bundle_stat.stat.isdir
    fail_msg: >-
      Set opencode_controller_workflows_bundle_dir to a rendered OpenCode bundle
      directory on the Ansible control host before enabling bundle deployment.
  when: opencode_manage_workflows_bundle | bool

- name: Deploy rendered OpenCode workflows bundle
  become: true
  ansible.builtin.copy:
    src: "{{ opencode_controller_workflows_bundle_dir }}/"
    dest: "{{ opencode_workflows_root_dir }}/"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: preserve
  when: opencode_manage_workflows_bundle | bool

- name: Ensure agent-orchestrator workflow compatibility directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0755"
  loop:
    - "{{ opencode_workflows_root_dir }}/common"
    - "{{ opencode_workflows_root_dir }}/opencode"
  when: opencode_manage_workflows_bundle | bool

- name: Link bundled prompts as agent-orchestrator common prompts
  become: true
  ansible.builtin.file:
    src: "{{ opencode_workflows_root_dir }}/prompts"
    dest: "{{ opencode_workflows_root_dir }}/common/prompts"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
  when: opencode_manage_workflows_bundle | bool

- name: Link bundled workflows as agent-orchestrator common workflows
  become: true
  ansible.builtin.file:
    src: "{{ opencode_workflows_root_dir }}/workflows"
    dest: "{{ opencode_workflows_root_dir }}/common/workflows"
    state: link
    force: true
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
  when: opencode_manage_workflows_bundle | bool

- name: Write OpenCode routing metadata for agent-orchestrator
  become: true
  ansible.builtin.template:
    src: opencode-routing.yaml.j2
    dest: "{{ opencode_workflows_root_dir }}/opencode/routing.yaml"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0644"
  when: opencode_manage_workflows_bundle | bool

- name: Validate controller-side AWB binary path
  ansible.builtin.stat:
    path: "{{ opencode_controller_awb_bin_path }}"
  delegate_to: localhost
  become: false
  register: _opencode_awb_bin_stat
  when: opencode_install_awb_cli | bool

- name: Require AWB binary source when AWB installation is enabled
  ansible.builtin.assert:
    that:
      - opencode_controller_awb_bin_path | length > 0
      - _opencode_awb_bin_stat.stat.exists
      - _opencode_awb_bin_stat.stat.isreg
    fail_msg: >-
      Set opencode_controller_awb_bin_path to a built awb binary on the Ansible
      control host before enabling AWB installation.
  when: opencode_install_awb_cli | bool

- name: Install AWB CLI for the opencode user
  become: true
  ansible.builtin.copy:
    src: "{{ opencode_controller_awb_bin_path }}"
    dest: "{{ opencode_awb_bin_dest }}"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0755"
  when: opencode_install_awb_cli | bool

- name: Validate controller-side agent-orchestrator source path
  ansible.builtin.stat:
    path: "{{ opencode_controller_agent_orchestrator_source_dir }}"
  delegate_to: localhost
  become: false
  register: _opencode_agent_orchestrator_source_stat
  when: opencode_install_agent_orchestrator | bool

- name: Require agent-orchestrator source when installation is enabled
  ansible.builtin.assert:
    that:
      - opencode_controller_agent_orchestrator_source_dir | length > 0
      - _opencode_agent_orchestrator_source_stat.stat.exists
      - _opencode_agent_orchestrator_source_stat.stat.isdir
    fail_msg: >-
      Set opencode_controller_agent_orchestrator_source_dir to the checked-out
      agent-orchestrator repository on the Ansible control host before enabling
      installation.
  when: opencode_install_agent_orchestrator | bool

- name: Copy agent-orchestrator source tree
  become: true
  ansible.builtin.copy:
    src: "{{ opencode_controller_agent_orchestrator_source_dir }}/"
    dest: "{{ opencode_agent_orchestrator_source_dir }}/"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: preserve
  when: opencode_install_agent_orchestrator | bool

- name: Install agent-orchestrator commands for the opencode user
  become: true
  become_user: "{{ opencode_user }}"
  ansible.builtin.command: "bash {{ opencode_agent_orchestrator_source_dir }}/install.sh --copy"
  environment:
    HOME: "{{ opencode_home_dir }}"
    PATH: "{{ opencode_local_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
  changed_when: false
  when: opencode_install_agent_orchestrator | bool

- name: Install helper wrapper for OpenCode orchestration passes
  become: true
  ansible.builtin.template:
    src: opencode-agent-loop.j2
    dest: "{{ opencode_agent_loop_helper_path }}"
    owner: "{{ opencode_user }}"
    group: "{{ opencode_group }}"
    mode: "0755"

# ── Managed OpenCode web service ──────────────────────────────────────────────

- name: Ensure /etc/opencode exists
  become: true
  ansible.builtin.file:
    path: /etc/opencode
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: opencode_web_service_enabled | bool

- name: Write OpenCode web service environment file
  become: true
  ansible.builtin.template:
    src: opencode-web.env.j2
    dest: "{{ opencode_server_env_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: "{{ opencode_server_password | length > 0 }}"
  when: opencode_web_service_enabled | bool

- name: Deploy OpenCode web systemd unit
  become: true
  ansible.builtin.template:
    src: opencode-web.service.j2
    dest: "/etc/systemd/system/{{ opencode_web_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: opencode_web_service_enabled | bool

- name: Reload systemd after updating OpenCode web unit
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: opencode_web_service_enabled | bool

- name: Enable and restart OpenCode web service
  become: true
  ansible.builtin.systemd:
    name: "{{ opencode_web_service_name }}"
    enabled: true
    state: restarted
  when: opencode_web_service_enabled | bool
